<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Nearby</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="nav-inner">
            <a class="logo" href="index.html"><span class="dot"></span>Nearby</a>
        </div>
    </header>

    <main class="page-container-narrow checkout-shell">
        <h1>Checkout</h1>

        <div id="order-summary" class="surface-card stack-sm">
            <p>Loading your order…</p>
        </div>

        <!--
          This is a DEMO checkout for a student project. It intentionally
          does not collect real card details — the original version had a
          separate "Payment" form asking for a card number, expiry, and
          CVV, but nothing in the JS ever actually submitted or processed
          it (no listener was attached, and even if it had been, storing
          raw card numbers server-side is something you should never do
          without a proper PCI-compliant payment provider like Stripe).
          This button just confirms the (fake) booking via checkout.php.
        -->
        <form id="checkout-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <button type="submit" id="checkout-submit">Confirm booking (demo — no payment taken)</button>
            <div id="checkout-message" class="form-notice"></div>
        </form>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="logo"><span class="dot"></span>Nearby</div>
            <div class="footer-links">
                <a href="browse.html">Browse</a>
                <a href="my-bookings.html">Bookings</a>
                <a href="terms.html">Terms</a>
                <a href="privacy.html">Privacy</a>
            </div>
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
